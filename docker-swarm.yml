# NOTE: `docker stack deploy` ignores env_file, so BOT_TOKEN and
# ALLOWED_CHAT_IDS are interpolated from your shell environment:
#   BOT_TOKEN=... ALLOWED_CHAT_IDS=... docker stack deploy -c docker-swarm.yml cfhost
services:
  bot:
    image: python:3-alpine
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS}
      DATA_DIR: /data
      APP_DIR: /app
      # APP_REPO_URL: https://github.com/rohjagad/cf-auto-custom-hostname.git
    volumes:
      - ./:/app
      - cfhost-data:/data
    working_dir: /app
    command: ["sh", "/app/entrypoint.sh"]
    deploy:
      restart_policy:
        condition: any

volumes:
  cfhost-data:
