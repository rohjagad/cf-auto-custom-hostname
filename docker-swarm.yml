# Swarm deploy: `docker stack deploy -c docker-swarm.yml cfhost`.
# Secrets live ONLY here — never commit other copies.
# Self-bootstrapping: on first run the app volume is empty, so the command
# fetches entrypoint.sh (busybox wget, no git needed) and entrypoint.sh
# then clones the rest of the source itself. Just redeploy — no manual seeding.
services:
  telebot:
    image: python:3-alpine
    environment:
      BOT_TOKEN: "PASTE_TELEGRAM_BOT_TOKEN_HERE"
      ALLOWED_CHAT_IDS: "PASTE_TELEGRAM_CHAT_ID_HERE"
      DATA_DIR: /data
      APP_DIR: /app
      # APP_REPO_URL: https://github.com/rohjagad/cf-auto-custom-hostname.git
    volumes:
      - telebot-app:/app
      - telebot-data:/data
    working_dir: /app
    command:
      - sh
      - -c
      - |
        if [ ! -f /app/entrypoint.sh ]; then
          wget -q -O /app/entrypoint.sh https://raw.githubusercontent.com/rohjagad/cf-auto-custom-hostname/main/entrypoint.sh
        fi
        exec sh /app/entrypoint.sh
    networks:
      - common-overlay
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.hostname == stb3

networks:
  common-overlay:
    external: true

volumes:
  telebot-app:
  telebot-data:
