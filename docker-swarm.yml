# Single-file deploy: `docker stack deploy -c docker-swarm.yml cfhost`.
# Secrets live ONLY here — never commit other copies.
services:
  bot:
    image: python:3-alpine
    environment:
      BOT_TOKEN: "PASTE_TELEGRAM_BOT_TOKEN_HERE"
      ALLOWED_CHAT_IDS: "PASTE_TELEGRAM_CHAT_ID_HERE"
      DATA_DIR: /data
      APP_DIR: /app
      # APP_REPO_URL: https://github.com/rohjagad/cf-auto-custom-hostname.git
    volumes:
      - ./:/app
      - cfhost-data:/data
    working_dir: /app
    command: ["sh", "/app/entrypoint.sh"]
    deploy:
      restart_policy:
        condition: any

volumes:
  cfhost-data:
