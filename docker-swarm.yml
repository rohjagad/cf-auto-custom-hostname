# Swarm deploy: `docker stack deploy -c docker-swarm.yml cfhost`.
# Secrets live ONLY here — never commit other copies.
# App source is cloned into a named volume by entrypoint.sh on first run.
services:
  telebot:
    image: python:3-alpine
    environment:
      BOT_TOKEN: "PASTE_TELEGRAM_BOT_TOKEN_HERE"
      ALLOWED_CHAT_IDS: "PASTE_TELEGRAM_CHAT_ID_HERE"
      DATA_DIR: /data
      APP_DIR: /app
      # APP_REPO_URL: https://github.com/rohjagad/cf-auto-custom-hostname.git
    volumes:
      - telebot-app:/app
      - telebot-data:/data
    working_dir: /app
    command: ["sh", "/app/entrypoint.sh"]
    networks:
      - common-overlay
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.hostname == stb3

networks:
  common-overlay:
    external: true

volumes:
  telebot-app:
  telebot-data:
