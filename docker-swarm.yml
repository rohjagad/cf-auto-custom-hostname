# Single-file deploy: `docker stack deploy -c docker-swarm.yml cfhost`.
# Secrets live ONLY here — never commit other copies.
services:
  bot:
    image: python:3-alpine
    environment:
      BOT_TOKEN: "8558513328:AAE2V0DFl8CwxEcizxaO7HRmO-Ku5ARj80M"
      ALLOWED_CHAT_IDS: "6713772874"
      DATA_DIR: /data
      APP_DIR: /app
      # APP_REPO_URL: https://github.com/rohjagad/cf-auto-custom-hostname.git
    volumes:
      - ./:/app
      - cfhost-data:/data
    working_dir: /app
    command: ["sh", "/app/entrypoint.sh"]
    deploy:
      restart_policy:
        condition: any

volumes:
  cfhost-data:
